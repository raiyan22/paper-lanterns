<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lanterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3e0d8;
  --accent: #2f5d50; --accent-ink: #ffffff; --good: #2e7d4f; --good-bg: #e6f3eb; --bad: #b3361f; --bad-bg: #fbe9e5;
  --chip: #efece4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161715; --panel: #1f201e; --ink: #ecebe6; --muted: #9b9a94; --line: #33342f;
    --accent: #7fb8a4; --accent-ink: #10201b; --good: #7fcf9c; --good-bg: #1d3125; --bad: #f08c76; --bad-bg: #3a221c;
    --chip: #2a2b28;
  }
}
:root[data-theme="dark"] {
  --bg: #161715; --panel: #1f201e; --ink: #ecebe6; --muted: #9b9a94; --line: #33342f;
  --accent: #7fb8a4; --accent-ink: #10201b; --good: #7fcf9c; --good-bg: #1d3125; --bad: #f08c76; --bad-bg: #3a221c;
  --chip: #2a2b28;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Hind Siliguri", "Inter", system-ui, sans-serif; font-size: 18px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
header h1 { font: 600 20px/1 "Inter", sans-serif; margin: 0; letter-spacing: -0.01em; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button:disabled { opacity: .5; cursor: default; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--chip); border-radius: 12px; padding: 12px; }
.stat b { display: block; font: 600 26px/1.1 "Inter", sans-serif; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; margin-right: 6px; }
.tierS { background: #f3dfb0; color: #4d3a00; } .tierA { background: #d6e6f5; color: #0e3557; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tierS { background:#4d3a00; color:#f3dfb0 } :root:not([data-theme="light"]) .tierA { background:#0e3557; color:#d6e6f5 } }
.q { font-size: 21px; font-weight: 500; margin: 10px 0 16px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 12px; font-size: 18px; }
.opt .k { color: var(--muted); margin-right: 8px; }
.opt.good { background: var(--good-bg); border-color: var(--good); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.answer { white-space: pre-wrap; background: var(--chip); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
.feedback { margin-top: 14px; font-weight: 600; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
.bar { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 6px 0 14px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
input, select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 100%; }
label { display: block; margin: 10px 0 4px; font-size: 15px; color: var(--muted); }
.sync { font: 13px "Inter", sans-serif; color: var(--muted); }
.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.actions button { flex: 1; min-width: 120px; padding: 12px; }
kbd { font: 12px "Inter", monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lanterns</h1>
    <nav>
      <button class="ghost" data-go="home">Home</button>
      <button class="ghost" data-go="stats">Progress</button>
      <button class="ghost" data-go="settings">Settings</button>
    </nav>
  </header>
  <div id="sync" class="sync"></div>
  <main id="view"></main>
</div>
<script src="app.js"></script>
</body>
</html>
